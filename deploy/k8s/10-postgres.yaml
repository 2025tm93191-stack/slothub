# PostgreSQL: one server, four databases (one per service), each with its own login — same as Docker Compose.
# StatefulSet + PersistentVolumeClaim, so data survives pod restarts and rescheduling.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: slothub
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: slothub }
spec:
  clusterIP: None            # headless: stable DNS name "postgres" for the StatefulSet pod
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: slothub
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: slothub }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: slothub }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # sub-directory: the volume root contains lost+found
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: slothub-db, key: POSTGRES_ADMIN_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: slothub-db, key: POSTGRES_ADMIN_PASSWORD } }
            - name: SCHEDULING_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: slothub-db, key: SCHEDULING_DB_PASSWORD } }
            - name: BOOKING_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: slothub-db, key: BOOKING_DB_PASSWORD } }
            - name: PAYMENT_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: slothub-db, key: PAYMENT_DB_PASSWORD } }
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: slothub-db, key: NOTIFICATION_DB_PASSWORD } }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""] }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
