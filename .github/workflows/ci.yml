name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SlotHub.slnx

      - name: Build
        run: dotnet build SlotHub.slnx --no-restore --configuration Release

      - name: Unit and integration tests
        run: dotnet test SlotHub.slnx --no-build --configuration Release --logger "trx;LogFilePrefix=tests" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
