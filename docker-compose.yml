# SlotHub — complete application on Docker Compose.
#
#   cp .env.example .env                  # once; set the passwords
#   docker compose up --build             # PostgreSQL + all 4 services (APIs on localhost:5101-5104)
#   docker compose up -d --build --wait   # same, detached, returns when every container is healthy
#   docker compose up -d --wait postgres  # only the database (then run services with scripts/run-service.sh)
#
# Secrets are never written here: every password comes from .env (git-ignored), and Compose refuses to start
# if one is missing. One PostgreSQL server hosts four databases, each owned by its own user; a user can
# connect only to its own database (CONNECT revoked from PUBLIC).
name: slothub

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

x-build-args: &build-args
  VERSION: ${SLOTHUB_VERSION:-1.0.0}
  REVISION: ${GIT_REVISION:-unknown}

services:
  postgres:
    image: postgres:17-alpine
    container_name: slothub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env (copy .env.example)}
      SCHEDULING_DB_PASSWORD: ${SCHEDULING_DB_PASSWORD:?Set SCHEDULING_DB_PASSWORD in .env (copy .env.example)}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD in .env (copy .env.example)}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env (copy .env.example)}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env (copy .env.example)}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduling:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/scheduling/Dockerfile
      args: *build-args
    image: slothub-scheduling:${SLOTHUB_VERSION:-1.0.0}
    container_name: slothub-scheduling
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=scheduling_db;Username=scheduling_user;Password=${SCHEDULING_DB_PASSWORD:?Set SCHEDULING_DB_PASSWORD in .env};GSS Encryption Mode=Disable
      DB_MIGRATE_ON_STARTUP: "true"
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-30}
      HOLD_SWEEP_INTERVAL_SECONDS: ${HOLD_SWEEP_INTERVAL_SECONDS:-5}
    ports:
      - "5101:8080"

  booking:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/booking/Dockerfile
      args: *build-args
    image: slothub-booking:${SLOTHUB_VERSION:-1.0.0}
    container_name: slothub-booking
    # Start only once the services it calls synchronously are healthy. Notification is reached through the
    # outbox, so Booking must not depend on it being up (an SMS outage never blocks bookings).
    depends_on:
      postgres:
        condition: service_healthy
      scheduling:
        condition: service_healthy
      payment:
        condition: service_healthy
      notification:
        condition: service_started
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=booking_db;Username=booking_user;Password=${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD in .env};GSS Encryption Mode=Disable
      DB_MIGRATE_ON_STARTUP: "true"
      Services__Scheduling__BaseUrl: http://scheduling:8080
      Services__Payment__BaseUrl: http://payment:8080
      Services__Notification__BaseUrl: http://notification:8080
      HTTP_ATTEMPT_TIMEOUT_SECONDS: ${HTTP_ATTEMPT_TIMEOUT_SECONDS:-2}
      HTTP_MAX_RETRIES: ${HTTP_MAX_RETRIES:-3}
      HTTP_TOTAL_TIMEOUT_SECONDS: ${HTTP_TOTAL_TIMEOUT_SECONDS:-20}
      HOLD_SAFETY_MARGIN_SECONDS: ${HOLD_SAFETY_MARGIN_SECONDS:-3}
      HOLD_SWEEP_INTERVAL_SECONDS: ${HOLD_SWEEP_INTERVAL_SECONDS:-5}
    ports:
      - "5102:8080"

  payment:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/payment/Dockerfile
      args: *build-args
    image: slothub-payment:${SLOTHUB_VERSION:-1.0.0}
    container_name: slothub-payment
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=payment_db;Username=payment_user;Password=${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env};GSS Encryption Mode=Disable
      DB_MIGRATE_ON_STARTUP: "true"
      CHAOS_FAILURE_RATE: ${PAYMENT_CHAOS_FAILURE_RATE:-0}
      CHAOS_LATENCY_MS: ${PAYMENT_CHAOS_LATENCY_MS:-0}
      CHAOS_FAILURE_MODE: ${PAYMENT_CHAOS_FAILURE_MODE:-DECLINE}
    ports:
      - "5103:8080"

  notification:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/notification/Dockerfile
      args: *build-args
    image: slothub-notification:${SLOTHUB_VERSION:-1.0.0}
    container_name: slothub-notification
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=notification_db;Username=notification_user;Password=${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env};GSS Encryption Mode=Disable
      DB_MIGRATE_ON_STARTUP: "true"
      NOTIFY_MAX_ATTEMPTS: ${NOTIFY_MAX_ATTEMPTS:-5}
      CHAOS_FAILURE_RATE: ${NOTIFICATION_CHAOS_FAILURE_RATE:-0}
      CHAOS_LATENCY_MS: ${NOTIFICATION_CHAOS_LATENCY_MS:-0}
      CHAOS_FAILURE_MODE: ERROR
    ports:
      - "5104:8080"

volumes:
  postgres-data:
