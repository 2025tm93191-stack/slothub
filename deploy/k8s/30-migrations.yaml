# One-off Jobs that apply each service's EF Core migrations (same image, MIGRATE_ONLY=true) before the Deployments
# start. Running migrations once here — instead of in every replica at start-up — avoids concurrent migrations.
# Jobs are immutable: scripts/k8s-deploy.sh deletes and re-creates them on every deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-scheduling
  namespace: slothub
  labels: { app.kubernetes.io/name: migrate-scheduling, app.kubernetes.io/part-of: slothub }
spec:
  backoffLimit: 10            # retried while PostgreSQL is still starting
  template:
    metadata:
      labels: { app.kubernetes.io/name: migrate-scheduling, app.kubernetes.io/part-of: slothub }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: slothub-scheduling:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MIGRATE_ONLY
              value: "true"
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: slothub-db, key: SCHEDULING_DB_PASSWORD } }
            - name: ConnectionStrings__Default
              value: Host=postgres;Port=5432;Database=scheduling_db;Username=scheduling_user;Password=$(DB_PASSWORD);GSS Encryption Mode=Disable
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
